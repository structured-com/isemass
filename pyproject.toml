[build-system]
requires = ["uv_build>=0.11.16"]
build-backend = "uv_build"

[project]
name = "isemass"
version = "0.4.0.dev0"
description = "Mass-change operations (like CoA) for Cisco ISE or ISE-related NAD's"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
dependencies = [
    "click>=8.1",
    "netmiko>=4.4",
    "pandas>=2.2",
    "platformdirs>=4.2",
    "requests>=2.32",
    "rich>=13.7",
    "urllib3>=2.0",
]

[project.urls]
Homepage = "https://github.com/structured-com/isemass"
Issues = "https://github.com/structured-com/isemass/issues"

[project.scripts]
isemass = "isemass.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
