[build-system]
requires = ["uv_build>=0.11.16"]
build-backend = "uv_build"

[project]
name = "isemass"
version = "0.2.0dev0"
description = "Mass-change operations (like CoA) for Cisco ISE or ISE-related NAD's"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "click>=8.1",
    "platformdirs>=4.2",
    "requests>=2.32",
    "rich>=13.7",
    "urllib3>=2.0",
]

[project.scripts]
isemass = "isemass.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
