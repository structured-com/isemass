[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isemass"
version = "0.1.0"
description = "CLI framework for mass Cisco ISE related operations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "click>=8.1",
    "platformdirs>=4.2",
    "requests>=2.32",
    "rich>=13.7",
    "urllib3>=2.0",
]

[project.scripts]
isemass = "isemass.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/isemass"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
