

############################################################
# Change-of-Authority as run through ISE's Monitoring API
############################################################
[coa] 

# Turns on extra verbose logging (NOT IMPLEMENTED YET)
verbose = false

# API username. Prompts during runtime if omitted.
# username = "bob-example"

# Input text file containing MAC addresses
# Can be any format, even unclean, as MAC address will be extracted via RegEx patterns
# input_file = "macs.txt"

# Optional JSON file to write detailed per-MAC CoA results.
# output_file = "coa-results.json"

# API host to connect to, typically the MnT node FQDN or IP.
# host = "ise-mnt.example.com"

# Short ISE node name that processes the CoA request, typically a PSN.
# node = "ise-psn01"

# Maximum number of concurrent workers for CoA tasks.
max_workers = 20

# Skip HTTPS certificate validation when set.
insecure = false

############################################################
# Switch reauthentication through switch SSH
############################################################
[swauth]

# Turns on extra verbose logging (NOT IMPLEMENTED YET)
verbose = false

# Username for Cisco switches. Prompts during runtime if omitted.
# username = "bob-example"

# Input CSV file containing switch_address and mac_address columns.
# input_file = "switches-and-macs.csv"

# Maximum number of concurrent switch SSH workers.
max_workers = 20
